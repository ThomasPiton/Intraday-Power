<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intraday Power</title>
<meta name="description" content="How weather drives electricity demand, supply and prices in France and Germany. Open data, explained. Built by Thomas Piton.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Cpath d='M9 2L4 9h3.5L7 14l5-7H8.5z' fill='%23fff'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint (no flash).
  try { const t = localStorage.getItem("ip-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#today" aria-label="Intraday Power, home"><span class="logo" aria-hidden="true"></span>Intraday Power</a>
  <nav class="nav" aria-label="Pages" id="nav-top"></nav>
  <div class="top-actions">
    <div class="seg" id="country" role="group" aria-label="Country">
      <button data-v="FR">FR</button><button data-v="DE-LU">DE</button>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-9.54-5.18A5.4 5.4 0 0 1 13.36 3.1C12.92 3.04 12.46 3 12 3z"/></svg>
    </button>
  </div>
</header>

<div id="stale" class="banner" hidden></div>
<main id="page" tabindex="-1" aria-live="polite"></main>

<footer class="foot">
  <p>Built by Thomas Piton · open data from RTE éCO2mix (ODRÉ), Energy-Charts (Fraunhofer ISE; prices from Bundesnetzagentur | SMARD.de), SMARD, Elia, Elexon, Energinet, NVE, ENTSOG, Elering, REE · <span id="om-attr">Weather data by Open-Meteo.com (CC BY 4.0)</span> · not investment advice ·
  <a href="https://github.com/ThomasPiton/Intraday-Power" rel="noopener">source on GitHub</a> · <span id="updated"></span></p>
</footer>

<nav class="tabbar" aria-label="Pages" id="nav-bottom"></nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <button class="icon-btn sheet-close" data-close aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
